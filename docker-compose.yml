name: keepit

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keepit
      POSTGRES_PASSWORD: keepit
      POSTGRES_DB: keepit
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepit"]
      interval: 5s
      retries: 10

  # Object storage S3 local (equivalente ao Cloudflare R2 em produção) — SeaweedFS com API S3
  s3:
    image: chrislusf/seaweedfs:4.53
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["127.0.0.1:9000:9000"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  s3-init:
    image: amazon/aws-cli:2.40.3
    depends_on: [s3]
    volumes:
      - ./infra/s3/cors.json:/cfg/cors.json:ro
    environment:
      AWS_ACCESS_KEY_ID: keepit
      AWS_SECRET_ACCESS_KEY: keepit-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "until aws --endpoint-url http://s3:9000 s3 ls >/dev/null 2>&1; do sleep 1; done;
             aws --endpoint-url http://s3:9000 s3 mb s3://keepit-fotos 2>/dev/null || true;
             aws --endpoint-url http://s3:9000 s3api put-bucket-cors --bucket keepit-fotos --cors-configuration file:///cfg/cors.json;
             aws --endpoint-url http://s3:9000 s3 ls"

  # Caixa de e-mail local (equivalente ao Resend em produção) — UI em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  backend:
    build: { context: ./backend, target: dev }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://keepit:keepit@db:5432/keepit?schema=public
      S3_ENDPOINT: http://s3:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      CORS_ORIGIN: http://localhost:5173,http://frontend:5173
      # Em dev todas as requisições chegam pelo proxy do Vite (mesmo IP); limites ligados quebrariam o E2E.
      # Para testar o rate limit manualmente: RATE_LIMIT_DESLIGADO=false docker compose up -d backend
      RATE_LIMIT_DESLIGADO: ${RATE_LIMIT_DESLIGADO:-true}
      # Gateway simulado do M5 (dev). Em produção: false (ver .env.example)
      PAGAMENTO_SIMULADO: ${PAGAMENTO_SIMULADO:-true}
    ports: ["3333:3333"]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build: { context: ./frontend, target: dev }
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://backend:3333
      # Proxy /s3 (URLs assinadas do S3, ADR 0003 D3) e prefixo que o front usa para reescrever a origem da URL
      VITE_S3_PROXY_TARGET: http://s3:9000
      VITE_S3_PROXY: /s3
      # Vite 6+ bloqueia Hosts desconhecidos; libera o nome do serviço para o container e2e
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: frontend
    ports: ["5173:5173"]
    depends_on: [backend]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  # Testes E2E (Playwright) — só sobe com: docker compose --profile e2e run --rm e2e  (ou make e2e)
  # A versão da imagem deve ser IGUAL à de @playwright/test em e2e/package.json
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    working_dir: /e2e
    ipc: host
    init: true
    environment:
      E2E_BASE_URL: http://frontend:5173
      E2E_API_URL: http://backend:3333
      # Mesmo segredo do backend (vem do .env): permite aos helpers dispararem POST /internal/jobs
      JOBS_TOKEN: ${JOBS_TOKEN:?defina JOBS_TOKEN no .env}
      CI: ${CI:-}
    command: sh -c "npm ci && npx playwright test"
    depends_on: [frontend, backend]
    volumes:
      - ./e2e:/e2e
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      # Arquivos de infra conferidos por specs estáticos (CORS/ciclo de vida do bucket, cron das rotinas)
      - ./infra:/workspace/infra:ro
      - ./.github:/workspace/.github:ro
      - ./backend/Dockerfile:/workspace/backend/Dockerfile:ro
      - e2e_node_modules:/e2e/node_modules

volumes:
  pgdata:
  s3data:
  backend_node_modules:
  frontend_node_modules:
  e2e_node_modules:
