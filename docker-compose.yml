name: keepit

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keepit
      POSTGRES_PASSWORD: keepit
      POSTGRES_DB: keepit
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepit"]
      interval: 5s
      retries: 10

  # Object storage S3 local (equivalente ao Cloudflare R2 em produção) — SeaweedFS com API S3
  s3:
    image: chrislusf/seaweedfs:4.53
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:9000"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  s3-init:
    image: amazon/aws-cli:2.40.3
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: keepit
      AWS_SECRET_ACCESS_KEY: keepit-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "until aws --endpoint-url http://s3:9000 s3 ls >/dev/null 2>&1; do sleep 1; done;
             aws --endpoint-url http://s3:9000 s3 mb s3://keepit-fotos 2>/dev/null || true;
             aws --endpoint-url http://s3:9000 s3 ls"

  # Caixa de e-mail local (equivalente ao Resend em produção) — UI em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  backend:
    build: { context: ./backend, target: dev }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://keepit:keepit@db:5432/keepit?schema=public
      S3_ENDPOINT: http://s3:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports: ["3333:3333"]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build: { context: ./frontend, target: dev }
    environment:
      VITE_API_URL: http://localhost:3333
    ports: ["5173:5173"]
    depends_on: [backend]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  s3data:
  backend_node_modules:
  frontend_node_modules:
