name: CI
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    # Testes com banco usam o schema `test` deste PostgreSQL (vitest.config.ts + global-setup; ver ADR 0001)
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: keepit, POSTGRES_PASSWORD: keepit, POSTGRES_DB: keepit }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keepit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://keepit:keepit@localhost:5432/keepit?schema=public
      # Segredos só de CI: o env.ts exige no mínimo 32 caracteres e CODIGO_SECRET diferente do JWT_SECRET
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
      JOBS_TOKEN: ci-jobs-token-0123456789abcdef0123456789
      CODIGO_SECRET: ci-codigo-secret-0123456789abcdef01234567
      S3_BUCKET: ci
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --json | node ../infra/audit/auditar-prod.mjs

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { VITE_API_URL: "https://api.keepit.example" }
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  # E2E opcional: só roda manualmente (Actions > CI > Run workflow) ou com o rótulo "e2e" no PR
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build backend frontend
      - run: docker compose up -d --wait db
      - run: docker compose run --rm --no-deps backend npx prisma migrate deploy
      - run: docker compose up -d --wait backend frontend
      - run: docker compose exec -T backend npm run seed
      - run: docker compose --profile e2e run --rm e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
      - if: always()
        run: docker compose down -v
