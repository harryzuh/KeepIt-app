name: Rotinas agendadas
on:
  schedule: [{ cron: "0 * * * *" }]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Expirar/renovar assinaturas, apagar contas excluídas e limpar fotos órfãs do S3
        env:
          API_URL: ${{ secrets.API_URL }}
          JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
        run: |
          # Antes do deploy (DEPLOY.md, seção 7) os secrets não existem: pula sem falhar, em vez de mandar alerta toda hora.
          if [ -z "$API_URL" ] || [ -z "$JOBS_TOKEN" ]; then
            echo "::notice::Secrets API_URL e JOBS_TOKEN ainda não configurados; rotina pulada."
            exit 0
          fi
          resposta=$(curl -fsS -X POST "$API_URL/internal/jobs" -H "x-jobs-token: $JOBS_TOKEN")
          echo "Resultado: $resposta"
          # A rotina é fail-open por Casa: uma falha não impede as demais, mas o workflow precisa ficar vermelho
          # para alguém investigar (GitHub avisa por e-mail quem configurou o workflow).
          falhas=$(echo "$resposta" | jq -r '.falhas // 0')
          if [ "$falhas" != "0" ]; then
            echo "::error::A rotina terminou com $falhas falha(s). Veja os logs da API (procure por 'rotina')."
            exit 1
          fi
          # Fotos órfãs vencidas que o S3 não deixou apagar (limparFotosOrfas): não derruba a rotina, mas avisa.
          pendentes=$(echo "$resposta" | jq -r '.fotosOrfasPendentes // 0')
          if [ "$pendentes" != "0" ]; then
            echo "::warning::$pendentes foto(s) órfã(s) vencida(s) continuam no S3. Se repetir nas próximas horas, investigue o bucket."
          fi
